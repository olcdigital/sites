<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Admin{% endblock %} — {{ school['name'] }}</title>
<style>
  :root{ --navy:#0f172a; --blue:#2563eb; --blue-light:#eff6ff; --bg:#f6f7fb; --border:#e5e7eb; --text-dim:#6b7280; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:#1f2937; font-size:14px;}
  .app{display:flex; min-height:100vh;}
  .sidebar{width:230px; flex-shrink:0; background:var(--navy); color:#e2e8f0; padding:20px 14px;}
  .brand{font-weight:700; font-size:16px; color:#fff; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:14px;}
  .tenant{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:10px 12px; margin-bottom:16px;}
  .tenant .school{font-weight:600; color:#fff; font-size:13px;}
  .tenant .role{font-size:11px; color:#93c5fd; margin-top:2px;}
  nav a{display:block; padding:9px 10px; border-radius:8px; color:#cbd5e1; text-decoration:none; font-size:13.5px; font-weight:500; margin-bottom:2px;}
  nav a:hover{background:rgba(255,255,255,.06); color:#fff;}
  nav a.active{background:var(--blue); color:#fff;}
  .main{flex:1; min-width:0;}
  .topbar{background:#fff; border-bottom:1px solid var(--border); padding:14px 28px;}
  .topbar h1{margin:0; font-size:18px;}
  .topbar .sub{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .content{padding:24px 28px;}
  .card{background:#fff; border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:16px;}
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  .stat-card{background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px;}
  .stat-card .num{font-size:24px; font-weight:700;}
  .stat-card .label{font-size:12px; color:var(--text-dim); margin-top:2px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--text-dim); padding:8px 10px; border-bottom:1px solid var(--border);}
  td{padding:10px; border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px;}
  .badge.blue{background:var(--blue-light); color:var(--blue);}
  .badge.gray{background:#f1f5f9; color:#475569;}
  .badge.green{background:#ecfdf5; color:#059669;}
  .badge.amber{background:#fffbeb; color:#b45309;}
  .callout{background:var(--blue-light); border:1px solid #bfdbfe; border-radius:8px; padding:12px 14px; font-size:12.5px; color:#1e3a5f; margin-bottom:16px;}
  .tabs{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
  .tabs a{padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:600; border:1px solid var(--border); background:#fff; color:#475569; text-decoration:none;}
  .tabs a.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .footnote{font-size:11.5px; color:var(--text-dim); margin-top:10px;}
  .form-section{padding:18px 0; border-bottom:1px solid var(--border);}
  .form-section:first-of-type{padding-top:0;}
  .form-section-head{margin-bottom:14px;}
  .form-section-head h3{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--navy); margin:0;}
  .tt-btn{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:6px 12px; border-radius:20px; border:1px solid var(--border); background:#fff; color:#475569; cursor:pointer; font-family:inherit;}
  .tt-btn.active{background:var(--blue); color:#fff; border-color:var(--blue);}
  .btn{display:inline-flex; align-items:center; gap:6px; background:var(--blue); color:#fff; border:none; padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none;}
  .btn.secondary{background:#fff; color:#1f2937; border:1px solid var(--border);}
  .btn.danger{background:#fff; color:#b91c1c; border:1px solid #fecaca;}
  .field{margin-bottom:14px; max-width:420px;}
  .field label{display:block; font-size:11.5px; font-weight:600; color:#374151; margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field input[type=number], .field select, .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit; background:#fff;
  }
  .form-row{display:flex; gap:16px; flex-wrap:wrap;}
  .form-row .field{flex:1; min-width:180px;}
  .table-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .hub-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:14px; margin-top:4px;}
  .hub-card{display:block; background:#fff; border:1px solid var(--border); border-radius:10px; padding:16px; text-decoration:none; color:inherit; transition:border-color .1s, box-shadow .1s;}
  .hub-card:hover{border-color:var(--blue); box-shadow:0 1px 6px rgba(37,99,235,.12);}
  .hub-card .hc-name{font-size:14.5px; font-weight:700; color:var(--navy); margin-bottom:4px;}
  .hub-card .hc-meta{font-size:12px; color:var(--text-dim);}
  .hub-nav{display:flex; gap:6px; margin-bottom:16px;}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">AthleticsCMS</div>
    <div class="tenant">
      <div class="school">{{ school['name'] }}</div>
      <div class="role">Logged in as {{ user.role }} · {{ user.name }}</div>
    </div>
    <nav>
      <a href="/admin" class="{{ 'active' if active=='dashboard' }}">Dashboard</a>
      <a href="/admin/news" class="{{ 'active' if active=='news' }}">News</a>
      <a href="/admin/pages" class="{{ 'active' if active=='pages' }}">Pages</a>
      <a href="/admin/schedule" class="{{ 'active' if active=='schedule' }}">Schedule &amp; Results</a>
      <a href="/admin/rosters" class="{{ 'active' if active=='rosters' }}">Teams &amp; Rosters</a>
      <a href="/admin/players" class="{{ 'active' if active=='players' }}">Players</a>
      <a href="/admin/staff" class="{{ 'active' if active=='staff' }}">Staff Directory</a>
      <a href="/admin/settings" class="{{ 'active' if active=='settings' }}">Settings</a>
      <a href="/site/{{ school['slug'] }}" target="_blank">View Public Site ↗</a>
    </nav>
  </div>
  <div class="main">
    <div class="topbar">
      <h1>{% block heading %}{% endblock %}</h1>
      <div class="sub">{% block subheading %}{% endblock %}</div>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
