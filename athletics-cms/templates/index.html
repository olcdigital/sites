<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Athletics CMS — Phase 1 Prototype</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#0f172a; color:#e2e8f0; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0;}
  .card{background:#1e293b; border-radius:14px; padding:36px; max-width:440px; text-align:center;}
  h1{font-size:20px; margin-bottom:6px;}
  p{color:#94a3b8; font-size:13.5px; line-height:1.6;}
  a.btn{display:inline-block; margin:8px 6px; padding:11px 20px; border-radius:8px; background:#2563eb; color:#fff; text-decoration:none; font-weight:600; font-size:13.5px;}
  a.btn.secondary{background:transparent; border:1px solid #334155;}
</style>
</head>
<body>
  <div class="card">
    <h1>Athletics CMS — Phase 1 Prototype</h1>
    <p>A real, running instance backed by SQLite — the admin CMS and the public site, both reading from the same database.</p>
    <a class="btn" href="/admin">Open Admin CMS</a>
    <a class="btn secondary" href="/site/{{ school['slug'] }}">View Public Site</a>
  </div>
</body>
</html>
